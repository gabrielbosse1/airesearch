# ByteCore-DualMemory — small CPU / unit-test configuration.
#
# This is the *same class* as the production preset; only the integers change.
# It is small enough to forward+backward on a laptop CPU in seconds, which is
# what the regression suite uses. For the 183,830,791-parameter Phase 22 run see
# `configs/t4_scaled.yaml`.
#
# Load with:  python -c "from training.phase22_common import load_config; print(load_config('configs/default.yaml')['model'])"
# Unknown keys are rejected, not ignored (FoundationConfig.from_mapping).

model:
  vocab_size: 261                 # 256 raw bytes + BOS/EOS/PAD/REF_START/REF_END
  d_model: 64
  n_layers: 4
  n_heads: 4
  n_kv_heads: 0                   # 0 => multi-head attention (no GQA)
  d_ff: 256
  max_seq_len: 256
  dropout: 0.0
  norm_type: layernorm            # the Phase 16 defaults, reproduced exactly
  ffn_type: gelu
  position_type: learned
  refinement_steps: 0             # no refinement loop
  refinement_rank: 64
  rope_theta: 10000.0
  norm_eps: 0.00001
  gradient_checkpointing: false

# The scaled stack (RMSNorm + SwiGLU + RoPE + GQA + weighted-tied refinement) is
# what configs/t4_scaled.yaml enables. Overriding here changes no code path,
# only the numbers -- e.g. to smoke-test the wide components on CPU:
#
#   model:
#     norm_type: rmsnorm
#     ffn_type: swiglu
#     position_type: rope
#     n_kv_heads: 2
#     refinement_steps: 2

training:
  requested_precision: bfloat16
  precision: auto                 # auto | bfloat16 | float16 | float32
  grad_scaler: auto
  micro_batch_size: 2
  grad_accum: 1
  seq_len: 128
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 10
  max_grad_norm: 1.0
  lr_schedule: cosine
  adam_betas: [0.9, 0.95]
  seed: 23
  phase1_max_steps: 20
  phase2_max_steps: 10
  phase3_max_steps: 10
  log_every: 5
  checkpoint_every: 1000
  save_precision: float32

data:
  cache_dir: data_cache_phase22
  streaming: true
  shard_bytes: 67108864
  license_manifest: runs/phase22/dataset_manifest.json
  # Real Hub ids only; see data/phase22_sources.py. Copy the `phase1`/`phase2`
  # blocks from configs/t4_scaled.yaml to stream actual data.

checkpoints:
  local_dir: runs/phase22/checkpoints
  phase1_name: checkpoint_phase1.pt
  phase2_name: checkpoint_phase2.pt
  phase3_name: final_model.pt
  hf_repo: null
  hf_path_in_repo: phase22
  resume_from_hf: false
  atomic_write: true

output:
  report_dir: runs/phase22
  metrics_jsonl: runs/phase22/metrics.jsonl
  vram_jsonl: runs/phase22/vram.jsonl
