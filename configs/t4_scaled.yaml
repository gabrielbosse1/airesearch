# Phase 25.1 -- ByteCore-DualMemory, the 4-hour T4 pre-training preset.
# PT-BR-first: 50% Portuguese (Brazil) documents, 25% code, 15% multimodal,
# 10% English (data/sources.py enforces the quota, not just the expectation).
#
# Load with:  yaml.safe_load(open("configs/t4_scaled.yaml"))
# Model with: FoundationConfig.from_mapping(cfg["model"])
#
# PRECISION ON A TESLA T4 (Turing, sm_75): native bf16 is NOT available.
# Newer PyTorch can report bf16 EMULATION as supported; that is rejected for
# the forced memory-efficient SDPA path. `precision: auto` requires native
# Ampere+ support (compute capability >= 8 and including_emulation=False when
# available); T4 gets float16 + torch.amp.GradScaler. Both are 2-byte formats.
# Phase 25.6: confidence BCE scores raw logits in fp32 outside autocast; CUDA
# rejects probability BCE under autocast even if the probability is .float().
#
# Geometry: 8 layers x 1024-dim core, 16384 context, 8192-dim unified memory.
# Causal sliding-window attention: each byte attends to itself plus up to
# window_size=1024 previous bytes. Chunk-local SDPA masks avoid any (L,L)
# tensor; CUDA forces the memory-efficient backend (T4/sm_75 cannot use
# PyTorch Flash/cuDNN SDPA). The unified memory cross-attention hub is the
# ONLY path beyond the local window. The CUDA probe, not this YAML or the
# analytic simulator, is the final authority on T4 fit.

model:
  vocab_size: 265                  # 256 bytes + BOS/EOS/PAD + 6 tool/edit ids
  d_model: 1024
  n_layers: 8                      # all 8 layers carry a GatedSkillAdapter
  n_heads: 8
  n_kv_heads: 2                    # GQA: KV projections at 25% of MHA
  d_ff: 4096                       # SwiGLU hidden width
  max_seq_len: 16384               # RoPE: no learned position table
  attention_type: sliding_window
  window_size: 1024                # max lookback distance; self + 1024 previous
  sliding_chunk_size: 512          # query rows per chunk-local SDPA call
  memory_cross_attention: true
  dropout: 0.0
  norm_type: rmsnorm
  ffn_type: swiglu
  position_type: rope
  refinement_steps: 4              # adaptive loop: up to 4 "think" passes
  refinement_rank: 256
  max_thought_steps: 4             # Phase 24.4 latent scratchpad slots (B, 4, 1024);
                                   # bidirectional cross-attention, never byte-emitted,
                                   # frontier-only write-back keeps causality
  confidence_threshold: 0.9        # break early when confidence > 0.9
  memory_dim: 8192                 # the wide skill space
  rope_theta: 10000.0
  norm_eps: 0.000001
  gradient_checkpointing: true

memory:
  key_dim: 1024                    # high-fidelity matching against the core
  value_dim: 8192                  # skill matrices (text/image/audio/video)
  capacity: 2048                   # ONE physical bank; episodic is an alias
  decay_margin: 0.25               # stable softplus policy margins
  max_eviction_events: 256

encoders:                          # FROZEN feature extractors (never trained)
  image: vit_b_16                  # 768-dim; codec truncated to the 16k row
  audio: wav2vec2                  # 768-dim, mean-pooled over time
  video: null                      # T4 preset streams image/audio only; raw video
                                   # backbone stays disabled to avoid dead VRAM

training:
  requested_precision: bfloat16
  precision: auto                  # auto | bfloat16 | float16 | float32
  micro_batch_size: 1
  grad_accum: 32                   # effective batch = 32 x 16384-byte rows
  seq_len: 16384                   # actual packed/streamed training window
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  max_grad_norm: 1.0
  adam_betas: [0.9, 0.95]
  seed: 24
  max_steps: 200000                # time budget dominates in the 4h run
  max_minutes: 225                 # leave ~15 min of the 4h for setup/upload
  checkpoint_minutes: 10           # recoverable checkpoint cadence (Colab can vanish)
  checkpoint_every: 100            # step-based safety net
  log_every: 10
  confidence_loss_weight: 0.1      # auxiliary BCE on the confidence head
  decay_reg_weight: 0.01           # eviction-policy auxiliary loss
  entropy_threshold: 0.35          # normalised byte-entropy target cutoff
  ingest_to_memory: true           # write ingested matrices to the bank
  tool_trajectory_rate: 0.02       # mock-sandbox tool/edit trajectories (CE)
  mix_audit_batches: 100           # notebook pre-flight mix audit (100 x micro_batch)
  mix_audit_tolerance: 0.02        # allowed |doc share - target| per group (2 pp)

vram:
  target_max_gb: 13.5              # hard ceiling; representative CUDA probe
  simulator_safety_gb: 0.5         # allocator/backend reserve in ESTIMATE only
  require_gradient_checkpointing: true
  frozen_encoder_dtype: float16    # inference-only frozen backbones on CUDA;
                                   # trainable params/grads/Adam remain fp32

runtime:
  min_host_available_gb: 2.0       # measured SYSTEM RAM headroom, not CUDA VRAM
  max_audio_seconds: 30            # bound frozen Wav2Vec2 transient activations;
                                   # Trainer/probe samples = seconds * 16000 (Phase 25.7)
  notebook_monitor_seconds: 15     # parent heartbeat while the child starts/steps
  notebook_upload_seconds: 60      # remote logs even if no optimizer step completes

data:
  # Phase 24.2 STRICT streaming: build_mixture REJECTS streaming: false.
  # Every load_dataset call uses streaming=True and the returned object is
  # verified to be an IterableDataset (never a disk-backed Dataset).
  streaming: true
  # RAM-only reservoir for IterableDataset.shuffle(seed=..., buffer_size=...).
  # 1k documents per chain, zero disk; smaller than the former 10k reservoir
  # so preflight + trainer do not compete for Colab SYSTEM RAM. Media fallbacks
  # (embedded images / decoded audio) are capped at 100 rows in open_stream:
  # decoded media rows are 100-1000x larger than text and 10k of them could
  # OOM the instance. Map-style .shuffle(seed=...) is forbidden on streams.
  shuffle_buffer_size: 1000
  # PT-BR-FIRST mix (Phase 24.1). Fractions of DRAWN DOCUMENTS, enforced
  # quota-exactly per 100-draw window by data/sources.MixtureSampler
  # (largest-remainder allocation + seeded shuffle). Must sum to 1.0.
  # The byte/token share is a different quantity and is reported separately by
  # data/sources.audit_mixture() -- never confuse the two.
  weights:
    ptbr: 0.50                     # TucanoBR/GigaVerbo -> fineweb-2 por_Latn
    code: 0.25                     # bigcode/the-stack (Python + JavaScript)
    multimodal: 0.15               # COYO captions/images + LibriSpeech audio
    english: 0.10                  # HuggingFaceFW/fineweb (secondary language)

checkpoints:
  local_dir: runs/colab_latest/checkpoints
  hf_repo: gabrielbosse9/airesearch2
  hf_path_in_repo: checkpoints/checkpoint_latest.pt
  upload_minutes: 5                # logs/diagnostics sync independently of checkpoints
  upload_retries: 3
  fail_on_upload_error: true       # do not burn GPU time without recoverable remote state
  keep_local_previous: true        # one local fallback; Hub commit history keeps older revisions

output:
  run_dir: runs/colab_latest
  metrics_jsonl: runs/colab_latest/metrics.jsonl
  evaluate_final: true             # PT-BR/code samples saved to evaluation.json
