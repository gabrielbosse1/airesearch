# Phase 24.1 -- ByteCore-DualMemory, the 4-hour T4 pre-training preset.
# PT-BR-first: 50% Portuguese (Brazil) documents, 25% code, 15% multimodal,
# 10% English (data/sources.py enforces the quota, not just the expectation).
#
# Load with:  yaml.safe_load(open("configs/t4_scaled.yaml"))
# Model with: FoundationConfig.from_mapping(cfg["model"])
#
# PRECISION ON A TESLA T4 (Turing, sm_75): CUDA bf16 autocast is NOT available
# and raises at runtime. `precision: auto` resolves at runtime with
# torch.cuda.is_bf16_supported(): Ampere+ gets bfloat16, T4 gets float16 +
# torch.amp.GradScaler. Both are 2-byte formats; the fallback is required.
#
# Geometry: 8 layers x 1024-dim core, 4096 context, 8192-dim skill space.
# Every layer injects hidden += GatedSkillAdapter(hidden, memory):
#   query 1024 -> keys 1024 -> retrieve 8192 -> GLU 8192 -> 2048
#   -> split 2 x 1024 -> Information * sigmoid(Filter) -> 1024.

model:
  vocab_size: 265                  # 256 bytes + BOS/EOS/PAD + 6 tool/edit ids
  d_model: 1024
  n_layers: 8                      # all 8 layers carry a GatedSkillAdapter
  n_heads: 8
  n_kv_heads: 2                    # GQA: KV projections at 25% of MHA
  d_ff: 4096                       # SwiGLU hidden width
  max_seq_len: 4096                # RoPE: no learned position table
  dropout: 0.0
  norm_type: rmsnorm
  ffn_type: swiglu
  position_type: rope
  refinement_steps: 4              # adaptive loop: up to 4 "think" passes
  refinement_rank: 256
  max_thought_steps: 4             # Phase 24.4 latent scratchpad slots (B, 4, 1024);
                                   # bidirectional cross-attention, never byte-emitted,
                                   # frontier-only write-back keeps causality
  confidence_threshold: 0.9        # break early when confidence > 0.9
  memory_dim: 8192                 # the wide skill space
  rope_theta: 10000.0
  norm_eps: 0.000001
  gradient_checkpointing: true

memory:
  key_dim: 1024                    # high-fidelity matching against the core
  value_dim: 8192                  # skill matrices (text/image/audio/video)
  procedural_capacity: 1024
  episodic_capacity: 1024

encoders:                          # FROZEN feature extractors (never trained)
  image: vit_b_16                  # 768-dim; codec payload fits a 1024 context
  audio: wav2vec2                  # 768-dim, mean-pooled over time
  video: vit_b_16                  # sampled frames -> mean-pooled matrix

training:
  requested_precision: bfloat16
  precision: auto                  # auto | bfloat16 | float16 | float32
  micro_batch_size: 4
  grad_accum: 8                    # effective batch = 32 sequences
  seq_len: 1024                    # T4-safe training window (model cap 4096)
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  max_grad_norm: 1.0
  adam_betas: [0.9, 0.95]
  seed: 24
  max_steps: 200000                # time budget dominates in the 4h run
  max_minutes: 225                 # leave ~15 min of the 4h for setup/upload
  checkpoint_minutes: 30           # HF checkpoint cadence
  checkpoint_every: 500            # step-based safety net
  log_every: 10
  confidence_loss_weight: 0.1      # auxiliary BCE on the confidence head
  entropy_threshold: 0.35          # normalised byte-entropy target cutoff
  ingest_to_memory: true           # write ingested matrices to the bank
  tool_trajectory_rate: 0.02       # mock-sandbox tool/edit trajectories (CE)
  mix_audit_batches: 100           # notebook pre-flight mix audit (100 x micro_batch)
  mix_audit_tolerance: 0.02        # allowed |doc share - target| per group (2 pp)

vram:
  target_max_gb: 12.0              # measured probe shrinks batch 4->2->1 above

data:
  # Phase 24.2 STRICT streaming: build_mixture REJECTS streaming: false.
  # Every load_dataset call uses streaming=True and the returned object is
  # verified to be an IterableDataset (never a disk-backed Dataset).
  streaming: true
  # RAM-only reservoir for IterableDataset.shuffle(seed=..., buffer_size=...).
  # 10k documents ~ tens-to-hundreds of MB of RAM, zero disk. Media fallbacks
  # (embedded images / decoded audio) are capped at 1000 rows in open_stream:
  # decoded media rows are 100-1000x larger than text and 10k of them could
  # OOM the instance. Map-style .shuffle(seed=...) is forbidden on streams.
  shuffle_buffer_size: 10000
  # PT-BR-FIRST mix (Phase 24.1). Fractions of DRAWN DOCUMENTS, enforced
  # quota-exactly per 100-draw window by data/sources.MixtureSampler
  # (largest-remainder allocation + seeded shuffle). Must sum to 1.0.
  # The byte/token share is a different quantity and is reported separately by
  # data/sources.audit_mixture() -- never confuse the two.
  weights:
    ptbr: 0.50                     # TucanoBR/GigaVerbo -> fineweb-2 por_Latn
    code: 0.25                     # bigcode/the-stack (Python + JavaScript)
    multimodal: 0.15               # COYO captions/images + LibriSpeech audio
    english: 0.10                  # HuggingFaceFW/fineweb (secondary language)

checkpoints:
  local_dir: runs/checkpoints
  hf_repo: null                    # notebook passes --hf-repo gabrielbosse9/airesearch
  hf_path_in_repo: checkpoints/checkpoint_latest.pt

output:
  metrics_jsonl: runs/metrics.jsonl
