# Separate from Phase 18: this checkpoint is not compatible with FoundationConfig.
model:
  d_model: 512
  n_layers: 12
  n_heads: 8
  d_ff: 2048
  max_seq_len: 1024
  vocab_size: 268  # bytes 0..255, BOS/EOS/PAD + 9 reserved control ids
  dropout: 0.0
training:
  gradient_checkpointing: true
  precision: fp16  # T4 does not support native bf16
